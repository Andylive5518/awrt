name: Release WRT (JDC IPQ60xx)
run-name: Release - JDC IPQ60xx

on:
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  LAN_ADDR: "192.168.192.1"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 480
    permissions:
      contents: write
      actions: write

    steps:
      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix
          sudo -E apt -yqq install libfuse-dev
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E systemctl daemon-reload

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set Build Date and Timezone
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC+8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          INI_FILE=$(ls wrt_core/compilecfg/*.ini | head -1)
          REPO_URL=$(awk -F"=" '/^REPO_URL=/ {print $2}' "$INI_FILE")
          REPO_BRANCH=$(awk -F"=" '/^REPO_BRANCH=/ {print $2}' "$INI_FILE")
          echo "BUILD_SRC=${REPO_URL} (${REPO_BRANCH})" >> $GITHUB_ENV
          CONFIG_NAME=$(basename "$INI_FILE" .ini)
          echo "CONFIG_NAME=$CONFIG_NAME" >> $GITHUB_ENV

      - name: Pre Clone
        run: ./wrt_core/pre_clone_action.sh

      - name: Cache Dependencies
        uses: actions/cache@v5.0.2
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-${{ hashFiles('./repo_flag') }}
          restore-keys: |
            ${{ matrix.os }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Machine Information (Pre-build)
        run: |
          echo "=============== Pre-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "=================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "=================================================="
          echo "[Memory]"
          free -h
          echo "=================================================="
          echo "[Disk]"
          df -hT
          echo "--------------------------------------------------"
          df -hi
          echo "=================================================="
          echo "[Workspace]"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "=================================================="

      - name: Setup Swap & Disk Cleanup (Pre-build)
        run: |
          echo "========== Pre-build System Tuning =========="
          echo "[Swap] 检查已有 swap ..."
          if swapon --show | grep -q '^/'; then
            echo "  已有 swap，跳过创建"
          else
            echo "  创建 2GB swap 防止 OOM ..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          echo "Swap 状态:"
          swapon --show
          free -h
          echo ""

          echo "[Disk] 清理构建前的磁盘空间 ..."
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          sudo rm -rf /tmp/* 2>/dev/null || true
          sudo rm -rf /var/tmp/* 2>/dev/null || true
          sudo docker system prune -af 2>/dev/null || true
          df -h /
          echo "=============================================="

      - name: Build Firmware
        run: ./build.sh

      - name: Upload Debug to Release
        if: always()
        env:
          UPLOAD_REPO: Andylive5518/make_tmp
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          OPENWRT_PATH: ${{ github.workspace }}/action_build
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          RUN_ID="${{ github.run_id }}-${{ github.run_number }}"
          RELEASE_TAG="debug-${TIMESTAMP}-${RUN_ID}"

          echo "============================================"
          echo "RELEASE_TAG: ${RELEASE_TAG}"
          echo "OpenWrt path: ${OPENWRT_PATH}"
          echo "============================================"

          cd "${OPENWRT_PATH}"

          # --- 创建/获取 Release ---
          echo "[1/4] 创建 Release ..."

          release_id=""
          get_resp=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${UPLOAD_REPO}/releases/tags/${RELEASE_TAG}")

          http_code=$(echo "$get_resp" | tail -n1)
          if [ "$http_code" = "200" ]; then
            release_id=$(echo "$get_resp" | grep '"id":' | head -1 | sed 's/.*"id": *//;s/,.*//')
            echo "  Release 已存在，ID=${release_id}"
          fi

          if [ -z "$release_id" ]; then
            post_resp=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(printf '{"tag_name":"%s","name":"%s","prerelease":true}' \
                "${RELEASE_TAG}" \
                "Debug ${RELEASE_TAG} (run ${{ github.run_number }} @ jdcloud_ipq60xx)")" \
              "https://api.github.com/repos/${UPLOAD_REPO}/releases")

            release_id=$(echo "$post_resp" | grep '"id":' | head -1 | sed 's/.*"id": *//;s/,.*//')
            post_code=$(echo "$post_resp" | tail -n1)
            if [ "$post_code" != "201" ] || [ -z "$release_id" ]; then
              echo "  Release 创建失败: HTTP ${post_code}"
              echo "$post_resp" | head -c 300
              exit 1
            fi
            echo "  Release 创建成功，ID=${release_id}"
          fi

          # --- 打包 ---
          echo "[2/4] 打包调试文件 ..."
          # 构建失败后部分目录可能不存在，用 --ignore-failed-read 跳过
          tar -czf /tmp/debug_build.tar.gz \
            --ignore-failed-read \
            -C "${OPENWRT_PATH}" \
            feeds/ custom_feed/ package/ \
            include/ scripts/ config/ logs/ target/ toolchain/ tools/ \
            rules.mk version version.date \
            .config feeds.conf.default 2>/dev/null || true
          echo "  完成: $(du -h /tmp/debug_build.tar.gz 2>/dev/null | cut -f1)"

          # --- 上传 ---
          upload_asset() {
            local local_file="$1"
            local asset_name="$2"

            [ -f "$local_file" ] || { echo "  [跳过] ${asset_name}：文件不存在"; return 0; }

            local file_size
            file_size=$(stat -c%s "$local_file" 2>/dev/null || stat -f%z "$local_file" 2>/dev/null)
            echo "  上传 ${asset_name} ($(du -h "$local_file" | cut -f1)) ..."

            if [ "$file_size" -gt 2147483648 ]; then
              echo "  跳过 ${asset_name}：超过 GitHub 2GB 限制"
              return 0
            fi

            # 删除旧 asset（如存在）
            existing_asset_id=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${UPLOAD_REPO}/releases/${release_id}/assets" \
              | grep -o '"id":[0-9]*,"name":"'"${asset_name}"'"' \
              | grep -o '"id":[0-9]*' | sed 's/"id"://')
            if [ -n "$existing_asset_id" ]; then
              curl -s -X DELETE \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${UPLOAD_REPO}/releases/assets/${existing_asset_id}" \
                >/dev/null
            fi

            resp=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${local_file}" \
              "https://uploads.github.com/repos/${UPLOAD_REPO}/releases/${release_id}/assets?name=${asset_name}")

            put_code=$(echo "$resp" | tail -n1)
            if [ "$put_code" = "200" ] || [ "$put_code" = "201" ]; then
              echo "  上传成功: ${asset_name}"
            else
              echo "  上传失败: HTTP ${put_code}"
              echo "$resp" | head -c 300
            fi
          }

          upload_asset "/tmp/debug_build.tar.gz"   "build.tar.gz"

          rm -f /tmp/debug_build.tar.gz

          echo ""
          echo "============================================"
          echo "上传完成"
          echo "Release: https://github.com/${UPLOAD_REPO}/releases/tag/${RELEASE_TAG}"
          echo "============================================"

      - name: Get Kernel Verion
        run: |
          manifest=$(ls ./firmware/*.manifest 2>/dev/null | head -n1)
          if [ -n "$manifest" ]; then
            KVER=$(grep -oP "kernel.*" "$manifest" | grep -oP "[4-6]\.[0-9]+\.[0-9]+" | head -n1)
          else
            KVER="unknown"
          fi
          echo "KVER=$KVER" >> $GITHUB_ENV
          echo "Kernel Version: $KVER"

      - name: Delete Old Cache
        run: |
          retry_delete() {
            local key="$1"
            local attempt=1
            while [ $attempt -le 3 ]; do
              if gh cache delete "$key" 2>&1; then
                return 0
              fi
              echo "  [警告] gh cache delete \"$key\" 第${attempt}次失败，3秒后重试..."
              sleep 3
              attempt=$((attempt + 1))
            done
            echo "  [警告] gh cache delete \"$key\" 3次重试均失败，跳过"
            return 0
          }

          gh cache list --json key,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[1:] | .[].key' \
            | while read -r key; do
              retry_delete "$key"
            done
          echo "========cache status========"
          echo "ccache: $(du -sh ./action_build/.ccache | cut -f 1)"
          echo "staging: $(du -sh ./action_build/staging_dir | cut -f 1)"

      - name: Machine Information (Post-build)
        run: |
          echo "=============== Post-build Snapshot ==============="
          echo "Time: $(date '+%F %T %Z')"
          echo "Runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Kernel: $(uname -r)"
          echo "Uptime: $(uptime -p)"
          echo "===================================================="
          echo "[CPU]"
          lscpu | grep -E "Model name|Architecture|CPU\\(s\\)|Thread\\(s\\) per core|Core\\(s\\) per socket|CPU max MHz"
          echo "===================================================="
          echo "[Memory]"
          free -h
          echo "===================================================="
          echo "[Disk]"
          df -hT
          echo "----------------------------------------------------"
          df -hi
          echo "===================================================="
          echo "[Build Outputs]"
          du -sh ./action_build/.ccache 2>/dev/null || true
          du -sh ./action_build/staging_dir 2>/dev/null || true
          du -sh ./firmware 2>/dev/null || true
          echo "Firmware file count: $(ls -1 ./firmware 2>/dev/null | wc -l)"
          echo "===================================================="

      - name: Prepare Release Body
        run: |
          echo "云编译发布" > release_body.txt
          echo "源码：${{ env.BUILD_SRC }}" >> release_body.txt
          echo "Kernel: ${{ env.KVER }}" >> release_body.txt
          echo "WIFI密码: 12345678" >> release_body.txt
          echo "LAN地址: 192.168.168.1" >> release_body.txt
          echo "插件：" >> release_body.txt
          echo "$(grep -oP "luci-app(-[a-zA-Z0-9]{1,}){1,}" ./firmware/*.manifest | awk -F":" '{print $NF}')"  >> release_body.txt

      - name: Release Firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_DATE }}_jdcloud_ipq60xx_immwrt
          files: './firmware/*.*'
          body_path: ./release_body.txt
